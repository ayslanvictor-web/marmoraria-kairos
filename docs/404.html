<!DOCTYPE html>

<head>

<style>
  :root{ --ink:#070706; --gold:#C2A06B; --bone:#F0EAE0; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:32px 20px; background:var(--ink); color:var(--bone);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-weight:300; text-align:center; line-height:1.6;
  }
  .card{ max-width:34rem; }
  .mark{ color:var(--gold); font-size:1.6rem; letter-spacing:.5em; margin-left:.5em; }
  .code{
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:300;
    font-size:clamp(4.5rem,18vw,8rem); line-height:1; margin:18px 0 0; color:var(--bone);
  }
  h1{
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:400;
    font-size:clamp(1.6rem,5vw,2.3rem); margin:8px 0 14px; color:var(--bone);
  }
  p{ color:rgba(240,234,224,.62); margin:0 0 30px; font-size:.95rem; }
  .row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a.btn{
    display:inline-block; padding:13px 26px; text-decoration:none; font-size:.8rem;
    letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(194,160,107,.55);
    color:var(--gold); transition:background .25s, color .25s;
  }
  a.btn:hover{ background:rgba(194,160,107,.12); }
  a.btn--solid{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  a.btn--solid:hover{ background:#d4b47f; }
  @media (prefers-reduced-motion:no-preference){
    .card{ animation:rise .6s ease-out both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✦</div>
    <p class="code">404</p>
    <h1>Esta pedra não está no nosso catálogo.</h1>
    <p>A página que você procurou não existe ou mudou de lugar.<br>Volte ao início ou fale direto com a gente.</p>
    <div class="row">
      <a class="btn btn--solid" href="./">Voltar ao início</a>
